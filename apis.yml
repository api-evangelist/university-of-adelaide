- aid: university-of-adelaide:figshare-tenancy
  name: Adelaide Figshare Research Data Repository — Adelaide tenancy
  x-operator: tenant
  description: >-
    The University's research-data repository runs on Figshare at the institution-specific host
    adelaide.figshare.com. The DATA, the DOIs and the curation are Adelaide's; the CONTRACT, the
    object model and the engineering are Figshare's. This is the relationship the June 2026 profile
    got wrong: it stored Figshare's generic api.figshare.com/v2 OpenAPI in this repo and split it
    into ten per-tag definitions and eleven apis[] entries, giving one vendor contract eleven times
    the apparent footprint — and eleven other institutions in this cohort shipped the identical
    document. Those artifacts have been removed. Probed 2026-08-30: adelaide.figshare.com answers
    202 with an empty body, a bot challenge from Figshare's edge rather than a dead host, so the
    tenancy is live but not readable from this network. Figshare's contract is deliberately NOT
    stored here; it belongs to Figshare's own profile.
  humanURL: https://adelaide.figshare.com/
  baseURL: https://adelaide.figshare.com/
  tags:
  - Research Data
  - Repository
  - Figshare
  - Tenant
  - DataCite
  - Bot Blocked
  properties:
  - type: Documentation
    url: https://adelaide.edu.au/research/
- aid: university-of-adelaide:myuni-canvas
  name: MyUni Learning Management System (Instructure Canvas) — Adelaide tenancy
  x-operator: tenant
  description: >-
    The University's LMS runs on Instructure Canvas at myuni.adelaide.edu.au. The tenancy, roster
    and course content are Adelaide's; the API contract is Instructure's. It is recorded because it
    carries the only LTI conformance in this repo and it is genuinely machine-readable without
    credentials at two paths. Probed 2026-08-30: /api/lti/security/jwks returns an RSA JWKS (200),
    /.well-known/openid-configuration returns an OIDC discovery document declaring issuer
    https://myuni.adelaide.edu.au (200), /api/lti/courses/1/line_items returns 401 rather than 404,
    and the Canvas REST API returns 401 {"status":"unauthenticated"} on /api/v1/accounts,
    /api/v1/courses and /api/v1/users/self. The bare /api/v1 root 404s, as Canvas does on every
    deployment; the baseURL below records the base, not a callable document. Developer keys are
    issued only by institutional administrators. Canvas's contract is not stored here.
  humanURL: https://myuni.adelaide.edu.au/
  baseURL: https://myuni.adelaide.edu.au/api/v1
