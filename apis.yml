description: >-
  The University of Adelaide is a public research university in Adelaide, South Australia, founded
  in 1874 and a member of the Group of Eight. Since January 2026 it has been superseded by Adelaide
  University, the merged institution formed with the University of South Australia: ROR records the
  University of Adelaide (https://ror.org/00892tw58) as inactive with successor Adelaide University
  (https://ror.org/028g18b61), adelaide.edu.au now serves the merged institution, and its DataCite
  and Australian Access Federation records both read "Adelaide University". It operates no public
  developer program. A full crawl of the 10,326-URL adelaide.edu.au sitemap on 2026-08-30 returned
  no developer portal, no API reference, no open-data portal, and no OpenAPI under any path. Its
  genuinely institution-operated machine-readable surfaces are three: the DSpace 7.6.1 "Adelaide
  Research & Scholarship" repository at digital.library.adelaide.edu.au, which serves a keyless
  HAL/JSON REST API and a live OAI-PMH 2.0 endpoint under the institution's own Handle prefix 2440;
  and the institution's Shibboleth SAML 2.0 Identity Provider at au-idp.adelaide.edu.au, registered
  in the Australian Access Federation and scoped to adelaide.edu.au. Everything else that looks like
  an Adelaide API is a vendor contract running under an Adelaide name: adelaide.figshare.com is a
  Figshare tenancy, myuni.adelaide.edu.au is an Instructure Canvas tenancy exposing LTI 1.3 and OIDC
  discovery, and access.adelaide.edu.au is a PeopleSoft student system behind Okta SSO. This profile
  is deliberately thin because the footprint is thin.
