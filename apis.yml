- aid: university-of-adelaide:saml-idp
  name: Adelaide University Shibboleth Identity Provider (SAML 2.0)
  x-operator: institution
  description: >-
    The institution's own Shibboleth SAML 2.0 Identity Provider, serving machine-readable
    EntityDescriptor metadata from its own host. Confirmed live 2026-08-30: entityID
    urn:mace:federation.org.au:testfed:au-idp.adelaide.edu.au, shibmd:Scope adelaide.edu.au,
    signing certificate CN=au-idp.adelaide.edu.au, with HTTP-Redirect, HTTP-POST and
    POST-SimpleSign SSO bindings. Registered in the Australian Access Federation production
    aggregate (registrationAuthority https://aaf.edu.au) as "Adelaide University Identity
    Provider", alongside three Adelaide-operated service providers — the ChatMate AI platform, the
    Research GitLab, and the CAUDIT benchmarking system. Identity federation is
    institution-operated by definition and is the class this cohort most often fails to record.
