apis:
- aid: university-of-adelaide:dspace-rest
  name: Adelaide Research & Scholarship REST API
  x-operator: institution
  description: >-
    DSpace 7.6.1 HAL/JSON REST API for the University of Adelaide institutional repository
    "Adelaide Research & Scholarship", exposing communities, collections, items, bundles,
    bitstreams, discovery search, identifiers and versioning for theses, articles and other
    scholarly outputs. Confirmed live 2026-08-30: the root document returns dspaceName
    "Adelaide Research & Scholarship", dspaceVersion "DSpace 7.6.1" and 60 link relations, and read
    access requires no credentials. DSpace is open-source software from LYRASIS, deployed and
    operated by the University on its own host rather than consumed as a hosted service, so both
    the host and the operation are Adelaide's. No Adelaide-specific OpenAPI is published for it and
    none is generated here — the DSpace REST contract belongs to the DSpace project.
  humanURL: https://digital.library.adelaide.edu.au/
