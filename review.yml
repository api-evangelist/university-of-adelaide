  - date: '2026-08-30'
    rating: 2
    summary: >-
      Re-reviewed under the university pipeline's operator axis. The June 2026 review recorded
      https://api.figshare.com/v2/oai as an Adelaide interface; it is Figshare's generic endpoint,
      shared by every Figshare customer, and eleven other institutions in this catalog carried the
      same contract as their own. Ten OpenAPI definitions and 37 derived artifacts built from it
      have been removed. Adelaide's real institution-operated footprint is three endpoints: the
      DSpace 7.6.1 REST API, its OAI-PMH interface, and a Shibboleth SAML 2.0 Identity Provider
      registered in the Australian Access Federation — the last of which the June review missed
      entirely. Two vendor deployments are retained as tenant relationships. A full crawl of the
      10,326-URL adelaide.edu.au sitemap found no developer portal, API reference, open-data portal
      or OpenAPI. The institution has also been superseded: ROR marks University of Adelaide
      inactive with successor Adelaide University, the January 2026 merger with UniSA. The rating
      falls because the previous rating was Figshare's engineering, not Adelaide's.
    endpoints:
